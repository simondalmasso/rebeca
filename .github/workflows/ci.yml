name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm run secret:scan
      - run: npm run audit:prod

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse
          npm run e2e:server > lighthouse/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if node -e 'fetch("http://127.0.0.1:8787/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; then
              break
            fi
            sleep 1
          done
          node scripts/seed-lighthouse.mjs
          CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          for n in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:8787/               --chrome-path="$CHROME_PATH"               --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"               --only-categories=performance,accessibility,best-practices,seo               --output=json --output-path="lighthouse/lighthouse-$n.json" --quiet
          done
          node scripts/assert-lighthouse.mjs lighthouse/lighthouse-1.json lighthouse/lighthouse-2.json lighthouse/lighthouse-3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            lighthouse/
